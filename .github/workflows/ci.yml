# This repo is public, so its own CI must run on GitHub-hosted runners, not
# the fleet it builds — see development/03_SECURITY.md ("never serve
# pull_request on a public repo"). Do not change runs-on below to self-hosted.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/runner/Dockerfile
          config: .hadolint.yaml


  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: config/repos.yaml.example .github/workflows

  render-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - name: Render compose.generated.yaml from the example repo list
        run: |
          cp config/repos.yaml.example config/repos.yaml
          python3 scripts/render-compose.py
      - name: Validate with docker compose config
        run: |
          echo "GH_PAT=dummy-for-ci-validation-only" > .env
          docker compose -f compose.generated.yaml config >/dev/null

  render-macos-launchd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - name: Render launchd agents from the example macOS config
        run: |
          cp config/repos.yaml.example config/repos.yaml
          python3 scripts/render-macos-launchd.py
      - name: Validate generated launchd plists
        run: |
          python3 - <<'PY'
          import pathlib
          import plistlib

          paths = list(pathlib.Path(".runner-macos/launchd").glob("*.plist"))
          assert len(paths) == 1, paths
          plist = plistlib.loads(paths[0].read_bytes())
          assert plist["Label"].startswith("com.github-self-hosted-runner.")
          assert plist["KeepAlive"] is True
          assert plist["RunAtLoad"] is True
          assert plist["ProgramArguments"][1].endswith("macos-runner-loop.sh")
          PY

  render-windows-scheduled-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - name: Render Scheduled Tasks from the example Windows config
        run: |
          cp config/repos.yaml.example config/repos.yaml
          python3 scripts/render-windows-scheduled-task.py \
            --user "TESTHOST\\ci-user"
      - name: Validate generated Scheduled Task XML
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          ns_uri = "http://schemas.microsoft.com/windows/2004/02/mit/task"
          ns = {"t": ns_uri}
          task_dir = pathlib.Path(".runner-windows/scheduled-tasks")
          paths = list(task_dir.glob("*.xml"))
          assert len(paths) == 1, paths
          root = ET.fromstring(paths[0].read_text(encoding="utf-8"))
          assert root.tag == f"{{{ns_uri}}}Task"
          exec_el = root.find("./t:Actions/t:Exec", ns)
          assert exec_el.find("t:Command", ns).text == "pwsh.exe"
          args_text = exec_el.find("t:Arguments", ns).text
          assert "windows-runner-loop.ps1" in args_text
          principal = root.find("./t:Principals/t:Principal", ns)
          assert principal.find("t:LogonType", ns).text == "InteractiveToken"
          assert principal.find("t:RunLevel", ns).text == "LeastPrivilege"
          restart = root.find("./t:Settings/t:RestartOnFailure", ns)
          assert restart is not None
          PY

  dashboard-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - name: Start the dashboard with no fleet configured
        run: |
          python3 scripts/dashboard.py --port 8787 &
          echo $! > dashboard.pid
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8787/api/status \
                >/dev/null; then
              break
            fi
            sleep 0.5
          done
      - name: Smoke-test every endpoint
        run: |
          curl -sf http://127.0.0.1:8787/ >/dev/null
          curl -sf http://127.0.0.1:8787/api/status \
            | python3 -m json.tool >/dev/null
          curl -sf "http://127.0.0.1:8787/api/logs?id=bogus" \
            | python3 -m json.tool >/dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8787/nope)
          test "$code" = "404"
      - name: Stop the dashboard
        if: always()
        run: kill "$(cat dashboard.pid)" 2>/dev/null || true
